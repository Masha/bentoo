# profiles/catalog.toml -- what a bentoo system can be composed from.
#
# Schema 2. Three consumers read this file; Portage ignores it:
#   * scripts/check-profile-matrix.sh  validates it (--static) and applies the
#     composition rule (--compose) before every commit that touches profiles/;
#   * `bentoo profile` (app-portage/bentoolkit, Go) offers these presets and
#     layers to users and writes /etc/portage/make.profile/parent from them;
#   * `shidashi order` (Python) reads the same presets and layers.
# All of them must agree, so any incompatible change bumps `schema` -- a
# consumer refuses a schema it does not know rather than guessing.
#
# Schema 2 describes every preset on seven axes. Two of them are new:
#   * toolchain = "gcc" | "llvm" -- the compiler the ::gentoo profile builds
#     with. It replaces the former boolean `llvm` key, which no longer exists.
#   * libc = "glibc" | "musl" -- the C library. The glibc presets are the
#     default/linux/amd64/23.0 profiles; the musl presets are ::gentoo's amd64
#     23.0/musl profiles (merged-/usr only, never split-usr), every one of
#     them no-multilib and without a desktop.
#
# profiles/catalog-vectors.toml, which carries the same `schema`, holds the
# composition rule as executable cases: a selection, then either the parent
# lines it produces or the set of rules it breaks. check-profile-matrix.sh
# and every other consumer run the same cases, so no implementation of the
# rule can drift from the others.
#
# Binhost coverage is NOT catalog data. The official binhost serves
# no-multilib x glibc x gcc x non-hardened x {openrc, systemd}; a consumer
# learns what it covers from the binhost index, never from this file, so the
# two can never disagree.
#
# A composition is one [[preset]] (a ::gentoo profile plus features/branding)
# followed by at most one layer per exclusive type and any number of the
# others. A layer is selectable only when its `base` holds for the preset's
# attributes, it conflicts with no other selected layer (declared on both
# sides) and everything it `requires` is selected. The parent lines are
# ordered by type rank, then by the order the layers are declared here, so
# declaration order is precedence: a later layer overrides an earlier one.
#
# Ids are paths relative to profiles/, so an id is also the `bentoo:<id>` line
# Portage reads. Preset entries mirror profiles/profiles.desc one to one,
# status included. A layer that only works on some value of an axis says so
# in its `base`; hardened, selinux and toolchain constrain no layer yet, and
# they are axes anyway so adding a layer that needs them costs no bump.

schema = 2

[attributes]
init      = ["openrc", "systemd"]
multilib  = [true, false]
desktop   = ["none", "generic", "plasma", "gnome"]
hardened  = [true, false]
selinux   = [true, false]
toolchain = ["gcc", "llvm"]
libc      = ["glibc", "musl"]

# rank orders the parent lines; exclusive allows at most one layer of the type.
[types.flavor]
rank      = 1
exclusive = true

[types.mix-in]
rank      = 2
exclusive = false

[types.hardware]
rank      = 3
exclusive = false

# --- presets: one per amd64 line of profiles.desc --------------------------

