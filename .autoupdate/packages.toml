["app-editors/zed-bin@stable"]
url = "https://api.github.com/repos/zed-industries/zed/releases/latest"
parser = "json"
path = "tag_name"
headers = { "User-Agent" = "bentoo-autoupdate" }
type = "bin"
series = '^[0-9.]+$'
version = "1.14.2"
comments = """
zed-bin (stable channel) — releases/latest is the stable release by definition
(prerelease=false); upstream tags it "vX.Y.Z" and the preview "vX.Y.Z-pre".

series matches on the ABSENCE of a suffix rather than on a version prefix,
because here the channels are told apart by the marker, not by the series
number: the stable line advances 1.13 -> 1.15 -> … and a numeric pin would
freeze this entry on one of them. Nothing to maintain as upstream moves.

Without it this entry was broken: the overlay also holds zed-bin-1.14.1_pre, the
scan returned that as "current", and every stable release below 1.14.1 compared
older and reported "up to date" — the stable line silently stopped updating.
"""
# END

["app-editors/zed-bin@preview"]
url = "https://api.github.com/repos/zed-industries/zed/releases?per_page=20"
parser = "regex"
pattern = '"tag_name":\s*"v([0-9.]+-pre)"'
transform = [['-pre$', "_pre"]]
select = "max"
headers = { "User-Agent" = "bentoo-autoupdate" }
type = "bin"
series = '_pre$'
version = "1.15.0_pre"
comments = """
zed-bin (preview channel) — releases/latest never returns a prerelease, so the
preview needs the full list: the pattern takes only "vX.Y.Z-pre" tags and the
transform maps upstream's "-pre" to Gentoo's "_pre" (no suffix field needed —
the marker is already in the tag). select=max guards against the list not being
strictly ordered, and series keeps this entry off the stable ebuild.
"""
# END

