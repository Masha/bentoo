["dev-build/gn"]
hold = true
url = "https://deps.gentoo.zip/dev-build/gn/"
parser = "regex"
pattern = 'gn-([0-9][0-9.]*)\.tar\.xz'
select = "max"
version = "0.2501"
comments = """
gn — deps.gentoo.zip lists tarballs in ascending order; select=max picks the
highest (was SKIP: assumed git-only, but the mirror does host versioned tarballs).

hold = true ON PURPOSE, and the probe means the OPPOSITE of a bump signal.
Upstream publishes commits, never releases, so PV is 0.<count> from
`git describe ${GN_COMMIT} --abbrev=12 --match initial-commit` and somebody must
package the snapshot. This overlay generates and hosts its own (SRC_URI points at
distfiles.obentoo.org; the recipe and the pinned commit are in the ebuild), so a
bump is never a plain PV swap — the tarball has to be built and uploaded FIRST,
and an auto-bump would commit an ebuild whose SRC_URI 404s. Do not remove hold.

THE RETIRE CHECK IS MANUAL. Say plainly what hold costs, because the previous
wording promised a signal that cannot fire: a held record is SKIPPED by bulk
`--check`, so nothing here ever reaches the pending queue on its own. The one
invocation that would fire it, `--check dev-build/gn --force`, is unsafe on this
host — it enqueues into ~/.config/bentoo/autoupdate/pending.json, which an
external timer applies to the working tree, so the check would mutate the tree
it is checking. Reproduce the record's own fetch instead:

  curl -sS "https://deps.gentoo.zip/dev-build/gn/" \\
    | grep -oE 'gn-[0-9][0-9.]*\\.tar\\.xz' | sort -V | tail -1

WHEN: at every dev-build/gn bump (you are already in this package), and whenever
a chromium/dawn build needs a gn newer than the one hosted here.
WHAT IT MEANS: while that number is BELOW our PV, ::gentoo is still behind and
the self-hosting stays. Once it reaches or passes our PV, the self-hosting can be
retired — drop GN_COMMIT and the recipe, point SRC_URI back at deps.gentoo.zip,
and this record goes back to being an ordinary bump signal with hold removed.
LAST OBSERVED 2026-08-03: 0.2374 against our 0.2501 — vercmp = -1, still behind.
"""
# END

["app-office/libreoffice@stable"]
url = "https://downloadarchive.documentfoundation.org/libreoffice/old/"
parser = "regex"
pattern = 'href="([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)/"'
select = "max"
series = '^26\.2\.'
version = "26.2.5.2"
comments = """
libreoffice (stable line) — old/ lists every 4-segment release directory of both
release lines, so series pins this entry to 26.2.x and select=max takes the
newest within it. The testing line has its own entry (@testing) and its own
pending/cache record.

WHEN THE STABLE LINE MOVES ON (26.8 promoted, a 27.2 opening): repoint series
here and in @testing together. A stale series is not silent — a version outside
it fails the check loudly instead of bumping the wrong line.
"""
# END

["app-office/libreoffice@testing"]
url = "https://downloadarchive.documentfoundation.org/libreoffice/old/"
parser = "regex"
pattern = 'href="([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)/"'
select = "max"
suffix = "_pre"
series = '^26\.8\.'
version = "26.8.0.1_pre"
comments = """
libreoffice (testing line) — same index as @stable, pinned to 26.8.x. Upstream
numbers a testing release exactly like a final one (download.documentfoundation
.org/libreoffice/stable/ stops at 26.2.5 while testing/ carries 26.8.0), so
suffix marks it _pre: Gentoo sorts _pre below the bare version, which keeps the
ebuild honest AND makes the bump fire the moment upstream promotes the release.
The ebuild strips the marker for SRC_URI via MY_PV="${MY_PV/_pre/}".

No suffix_when is needed here: series already delimits the line.
"""
# END

["app-office/libreoffice-l10n@stable"]
url = "https://downloadarchive.documentfoundation.org/libreoffice/old/"
parser = "regex"
pattern = 'href="([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)/"'
select = "max"
series = '^26\.2\.'
version = "26.2.5.1"
comments = """
libreoffice-l10n (stable line) — follows the core release, so it reads the same
archive index rather than the headless src/ probe: that probe returns whatever
is newest overall, which is the testing line, and a stable entry must not see
it. Promote together with app-office/libreoffice@stable.
"""
# END

["app-office/libreoffice-l10n@testing"]
url = "https://downloadarchive.documentfoundation.org/libreoffice/old/"
parser = "regex"
pattern = 'href="([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)/"'
select = "max"
suffix = "_pre"
series = '^26\.8\.'
version = "26.8.0.1_pre"
comments = """
libreoffice-l10n (testing line) — reads the same archive index as
app-office/libreoffice@testing, and for the same reason: it follows the core
release, so both must see one and the same version.

Was the headless src//@libreoffice.js probe until 2026-08-01; dropped because
that index carries every release since 2012 (~590 KB, ~16 s just to transfer)
and the script then fetches a per-release dir on top of it, so the browser page
load kept dying on ERR_TIMED_OUT. The archive index is ~97 KB, lists the
4-segment version directly, and needs no browser at all.

series asserts this really is the 26.8 line, so the day upstream moves on the
check fails loudly instead of bumping the wrong ebuild. Same _pre marker and
same promotion moment as app-office/libreoffice@testing.
"""
# END

["app-dicts/myspell-hu"]
