# Bentoo Autoupdate Package Configuration
# Each section defines how to check upstream versions for a package.
#
# Records were generated by inspecting each upstream source by real download
# (curl/gh + Playwright/Chrome DevTools for SPAs), validating that the chosen
# parser/path/pattern extracts the current version and compares correctly to the
# ebuild (Gentoo version rules: prefixes v/release-/ver-/version- stripped;
# regex returns capture group 1 of the FIRST match on the raw body).
#
# 411 records — 228 regex, 183 json. 20 disabled (enabled = false),
# 3 held (hold = true): dev-build/gn, dev-lang/ghc, sci-ml/stable-diffusion-cpp.
#
# No record uses parser = "script" any more: the three that did (antigravity-bin,
# antigravity-hub-bin, gitkraken) were migrated to regex on 2026-08-06 because
# their headless-Chrome route had started failing. The .autoupdate/scripts/
# directory was deleted with them. Note that the LLM registry fixer which
# performs such a migration cannot remove a file — it may only add or edit one —
# so a future parser change away from "script" will again leave the .js behind
# for someone to delete by hand.
#
# Recount with tomllib, never with grep: `grep -c 'enabled = false'` also matches
# that phrase inside comment prose, so it overcounts, and anchoring the pattern
# only reduces the error instead of removing it. When this was first measured the
# three answers were 98 unanchored, 95 anchored and 92 real. Parse the file:
#   python3 -c "import tomllib,collections as c;d=tomllib.load(open('.autoupdate/packages.toml','rb'));p={k:v for k,v in d.items() if isinstance(v,dict) and 'url' in v};print(len(p),dict(c.Counter(v.get('parser') for v in p.values())),sum(1 for v in p.values() if v.get('enabled') is False))"
#
# A package whose upstream is unreachable or gone gets NO record here — a record
# promises an endpoint that answers. Those are listed in dead-upstreams.md.
#
# NOTE: BEGIN/END markers below are comments only. Do NOT use bare [BEGIN]/[END]
# table syntax here — TOML would parse them as phantom packages.
#
# HISTORY: this header, and the per-family section banners that once grouped the
# records, were lost on 2026-07-31 in a bulk regeneration of the file (commit
# f1c8872f, +1730/-600). The autoupdate tool itself does NOT rewrite this file
# wholesale — it edits the `enabled` line surgically — so anything written here
# survives an --apply. The banners have not been reconstructed; each record now
# carries its own doc comment instead. Restored 2026-08-02.
#
# ============================================================================
#                        RECORD MODEL — follow it verbatim
# ============================================================================
# Every record obeys the field ORDER below (bookkeeping → source → extraction →
# post-processing → auxiliary substitution → transport → classification → doc).
# Omit every field you do not need; never reorder, never invent a key —
# bentoolkit's PackageConfig (internal/autoupdate/config.go) is the sole
# authority on what parses, and an unknown key is silently ignored.
#
#   ["category/package"]                # header: quoted, exactly as in the overlay
#   enabled = false                     # ONLY when false. Absent = enabled.
#   hold = true                         # ONLY when true. See "enabled vs hold".
#   track = "commit"                    # omit for tag/version tracking
#   url = "https://…"                   # REQUIRED — the endpoint being probed
#   timeout = 60                        # seconds, only for reliably slow hosts
#   parser = "json"                     # REQUIRED — json | regex | html | script
#   path = "tag_name"                   # REQUIRED for parser=json
#   pattern = 'name-([0-9.]+)\.tar\.xz' # REQUIRED for parser=regex (1 capture group)
#   selector = "a.release-tag"          # REQUIRED for parser=html (or xpath)
#   script = "@vendor.js"               # REQUIRED for parser=script (scripts/vendor.js)
#   transform = [['^v', ""]]            # ordered regex substitutions on the result
#   select = "max"                      # first (default) | max | last
#   commit_sha_path = "[0].sha"         # REQUIRED with track="commit"
#   commit_message_path = "commit.message"
#   commit_version_pattern = 'sdk-([0-9.]+)'
#   aux_var = "MY_BUILD"                # free-text ebuild var kept in sync…
#   aux_pattern = 'esr-bb([0-9]+)'      # …always paired with aux_var
#   headers = { "User-Agent" = "bentoo-autoupdate" }
#   binary = true                       # binary package → manifest-only testing
#   type = "bin"                        # ONLY to override the -bin/RESTRICT heuristic
#   meta = { key = "value" }            # documentation only; NEVER a secret
#   # package — one line saying WHY this source/parser, plus every caveat a
#   # future bump must know (stale endpoints, prerelease traps, hand-edited vars).
#
# A complete record, for reference:
#
#   ["dev-libs/nettle"]
#   url = "https://ftp.gnu.org/gnu/nettle/?C=M;O=D"
#   parser = "regex"
#   pattern = 'nettle-([0-9.]+)\.tar\.gz'
#   comments = """
#   nettle — GNU FTP release dir sorted newest-first; file "nettle-X.Y.Z.tar.gz".
#   """
#   # END
#
# Rules that are not obvious from the field list:
#
# * DOC COMMENT goes BELOW the fields, as the last lines of the record, and
#   starts with the package name. Never above the header (a section banner does
#   live above, and the two must not be confused). It is mandatory whenever the
#   record deviates from its section's default; records in a uniform family
#   (KDE Plasma, GStreamer) are covered by the section banner alone.
# * REGEX values (pattern, aux_pattern, commit_version_pattern, and the left
#   side of every transform rule) use TOML LITERAL strings '…'. A basic string
#   "…" rejects \. and \d outright. Replacements use basic strings "…".
# * ENABLED vs HOLD. enabled is BOOKKEEPING the checker flips on its own: it
#   writes enabled = false when the ebuild vanishes from the overlay and back to
#   true when it reappears. hold is a MAINTAINER DECISION ("present, but never
#   auto-bump") that reconciliation never touches. A package that needs manual
#   work each release (patchset, pinned SHA, bootstrap compiler) takes hold —
#   enabled = false would be silently reverted. Both skip the fetch entirely.
#   Caveat measured on bentoolkit 0.15.0: hold is honoured by the CHECKER only —
#   `--check <pkg> --force` on a held package still queues it, and `--apply all`
#   will then apply it. Clear the queue rather than trusting hold to block it.
# * USER-AGENT is required by api.github.com and crates.io — always the literal
#   "bentoo-autoupdate". A browser UA is a last resort for a Cloudflare-fronted
#   host and must be justified in the doc comment. Note the inversion on some
#   hosts: sourceforge.net answers 403 and gitlab.freedesktop.org serves an
#   Anubis challenge (HTTP 200 with an HTML body!) when the UA looks like a
#   BROWSER, while a CLI UA passes. The checker's own default UA is already
#   CLI-shaped (bentoolkit/<version>), so a headerless record is not at risk.
# * REGEX returns capture group 1 of the FIRST match on the raw body; anchor it
#   so a page listing several releases cannot yield an older one (or use
#   select = "max"). The result is normalized before comparison (leading
#   v/release-/ver-/version- stripped) and must end up a Gentoo-shaped version.
# * PARALLEL CHANNELS: prefer a GitHub project's releases/latest endpoint over
#   ranking refs/tags. A repository shipping stable and beta from one tag space
#   has betas ABOVE its stable release (brave-browser marks v1.93.129 latest
#   while v1.95.x betas carry higher tags). Ordering /releases by date misleads
#   too — a republished older release can appear first.
# * DIVERGENT VERSION AXES: compare only within the ebuild's own scheme. Anchor
#   the pattern to the axis the ebuild uses (glslang and spirv-tools take
#   '^vulkan-sdk-…' because upstream ALSO tags semver; edk2 extracts the date
#   out of 'edk2-stable202605'). Where the axes cannot be reconciled, hold the
#   record rather than let it emit a cross-axis number.
# * VERIFY BEFORE COMMITTING: probe the real endpoint
#   (`bentoo overlay autoupdate --check <category/package> --force`) — never
#   hand-write a record from a guessed URL shape. Beware: on a host running the
#   apply timer, --check --force also ENQUEUES the package for auto-apply.

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>  BEGIN PACKAGES  <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<

