comments = """
pnpm — npm package, stable channel. dist-tags.latest is the RIGHT endpoint and
must stay: pnpm promotes through next-<major> first, and that channel carries
pre-releases (next-12 was 12.0.0-beta.3 on 2026-08-03), so probing next-11 would
