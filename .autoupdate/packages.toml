version = "0.10.0"
comments = """
uutils coreutils — tags are bare "X.Y.Z", no prefix to strip.  releases/latest
rather than /tags: the repo also carries a rolling "latest-commit" tag that
ranks unpredictably against real releases.

Temporary mirror of ::gentoo, which had not picked up 0.10.0 when this was
added.  It differs from the ::gentoo ebuild in ONE way that matters to a bump:
the ~400 crates are listed inline in CRATES instead of coming from the
consolidated tarball at github.com/gentoo-crate-dist/coreutils.  So a version
bump here is NOT just a PV change — regenerate the block, or the build dies
offline on a stale crate:
  pycargoebuild -d /var/cache/distfiles -o out.ebuild <unpacked source>
(crates.io rejects wget's default User-Agent; export a WGETRC with a browser
one first.)  Drop the package once ::gentoo catches up.
"""
# END

