["sci-ml/stable-diffusion-cpp"]
hold = true
url = "https://api.github.com/repos/leejet/stable-diffusion.cpp/releases/latest"
parser = "regex"
pattern = '"tag_name":\s*"master-([0-9]+)-[0-9a-f]+"'
transform = [['^(\d+)$', "0_pre$1"]]
headers = { "User-Agent" = "bentoo-autoupdate" }
version = "0_pre782"
comments = """
stable-diffusion-cpp — tags are "master-<build>-<shorthash>"; the regex yields
<build> and the transform restores the ebuild's PV=0_pre<build> scheme.  The
transform is load-bearing: without it the applier renames the package to a
bare "782", destroying the snapshot versioning (observed 2026-07-19).

That bare PV survived in the overlay until 2026-07-26 and was silently fatal
to the probe: Gentoo orders 0_pre783 BELOW 782, so every later build compared
as older and the package answered "up to date" forever.  Reverted to
0_pre782; if a bare PV ever shows up here again, that is the symptom.

NOT SAFE TO AUTO-APPLY.  A real bump needs TWO pinned values updated together
— MY_COMMIT (the tag's short hash) and GGML_COMMIT (the leejet/ggml submodule
gitlink at that tag) — and the applier syncs neither.  When upstream cuts a
new build, --apply will bump PV and leave both stale, so SRC_URI points at a
tag that does not exist and the fetch 404s.  That is a loud failure, not
silent corruption, but bump this package BY HAND: read the new tag, update
MY_COMMIT from its short hash and GGML_COMMIT from
`git ls-tree stable-diffusion.cpp <tag> -- ggml`.

Hence hold = true, not enabled = false: the latter does NOT stick, because
bentoolkit re-enables any record whose package is present in the overlay
(commit ba706dc8 flipped it back). hold is never auto-flipped.
"""
# END

["sci-ml/ik_llama-cpp"]
track = "commit"
url = "https://api.github.com/repos/ikawrakow/ik_llama.cpp/commits/main"
parser = "json"
path = "commit.committer.date"
transform = [['T.*', ""], ['-', ""]]
commit_sha_path = "sha"
base_from = "none"
headers = { "User-Agent" = "bentoo-autoupdate" }
version = "0_pre20260807"
comments = """
ik_llama-cpp — base_from = "none": upstream publishes no usable release
series.  Verified 2026-07-19 and again 2026-08-04: the repo has exactly ONE
tag, "t0002" (prerelease, 2025-07-22), roughly a year behind an actively
developed HEAD, and releases/latest 404s because that lone release is flagged
prerelease.  CMakeLists declares project() with no VERSION either.  A
tags-based probe reports `"t0002" not comparable to current 0_pre20260718` on
every run, so this tracks the default branch's committer date instead, which
IS the ebuild's versioning scheme (0_pre<YYYYMMDD>).

track = "commit" is what makes this auto-appliable, and it replaced hold = true
on 2026-07-26.  Two things had to be true for that, and neither was before:
  - the ebuild's SHA must live in a variable the commit applier rewrites, so
    MY_COMMIT was renamed to GIT_COMMIT.  Under the old name --apply moved the
    date and left the SHA behind: 0_pre20260725 shipped the 2026-07-18 tree
    under a renamed distfile — no 404, no error, just the wrong source.
  - the "0_pre" prefix must come from the snapshot suffix the checker carries
    over from the current PV, NOT from a transform.  A third transform rule
    ('^(\\d+)$' -> "0_pre$1") would compose with it and yield "0_pre0_pre<date>".
"""
# END

["sys-apps/fakeroot"]
url = "https://sources.debian.org/api/src/fakeroot/"
parser = "json"
path = "versions[0].version"
transform = [["-[0-9.]+$", ""]]
version = "2.1.4"
comments = """
fakeroot — developed inside Debian, with no upstream release page of its own.
Do NOT probe the pool listing (deb.debian.org/debian/pool/main/f/fakeroot/): it
is sorted alphabetically, so 1.37.1.1 appears before 2.1.4 and a first-match
regex would report the OLDER version as the newest.  sources.debian.org orders
versions newest first, versions[0] being sid/forky.  The transform strips the
Debian revision ("2.1.4-1" -> "2.1.4"), which is how the .orig.tar.xz in
SRC_URI is named.

This record is temporary, like the package: bentoo carries fakeroot only
because ::gentoo is stuck on 1.33 (2025).  Drop both once ::gentoo ships 2.x.
"""
# END

["sys-apps/uutils-coreutils"]
