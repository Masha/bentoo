masters = gentoo
thin-manifests = true
sign-manifests = false

# profile-repo-deps allows ::repo in profile files, so profiles/package.mask can
# name a package in a *master* repository.  Without it Portage silently rewrites
# every repo-level mask atom as "<atom>::bentoo" (MaskManager append_repo), and a
# mask can then only ever reach this overlay's own ebuilds -- masks flow down the
# masters chain, never up.  net-libs/nodejs:0::gentoo depends on this.
# portage-2 is the current profile format; it is named explicitly because setting
# profile-formats at all replaces the implicit portage-1-compat default.
profile-formats = portage-2 profile-repo-deps
