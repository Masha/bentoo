masters = gentoo
thin-manifests = true
sign-manifests = false

# profile-repo-deps allows ::repo in profile files, so profiles/package.mask can
# name a package in a *master* repository.  Without it Portage silently rewrites
# every repo-level mask atom as "<atom>::bentoo" (MaskManager append_repo), and a
# mask can then only ever reach this overlay's own ebuilds -- masks flow down the
# masters chain, never up.  net-libs/nodejs:0::gentoo depends on this.
# portage-2 is the current profile format; it is named explicitly because setting
# profile-formats at all replaces the implicit portage-1-compat default.
# profile-bashrcs enables package.bashrc, which profiles/features/branding uses
# to brand two ::gentoo packages (baselayout, kinfocenter) and to work around
# ::gentoo build breakage (llvm/clang 23 manpages) without forking them.
# profile-set makes a bare atom in a profile `packages` file join @profile, which
# is how the composable layers (profiles/targets, profiles/features) install
# their packages.  Without it Portage silently ignores those bare atoms; a
# `*atom` (features/branding) keeps going to @system either way.
# profile-license enables package.license in profiles: a hardware layer accepts
# its driver's licence for that package only. ACCEPT_LICENSE in a profile's
# make.defaults is NOT incremental -- the last profile wins -- so a layer
# setting it would replace @FREE for the whole system (coreutils masked).
profile-formats = portage-2 profile-repo-deps profile-bashrcs profile-set profile-license
